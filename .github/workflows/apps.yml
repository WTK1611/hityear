name: Native Apps prüfen
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'public/**'
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci && npm --prefix mobile ci
      - run: npm run typecheck && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci && npm --prefix mobile ci
      - run: npm --prefix mobile run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: hityear-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm --prefix mobile ci && npm run mobile:sync
      - run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath /tmp/hityear-ios build
