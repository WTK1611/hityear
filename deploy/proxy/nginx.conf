# /etc/nginx/sites-available/party-music  (Domain anpassen)
# Zertifikat: certbot --nginx -d party-music.example.de
server {
    listen 80;
    listen [::]:80;
    server_name party-music.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name party-music.example.de;

    ssl_certificate     /etc/letsencrypt/live/party-music.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/party-music.example.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rechten Eintrag setzt nginx selbst – nur dem vertraut Zeitstrahl
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
